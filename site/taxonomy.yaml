# =============================================================================
#  AUTOMATIC TAGGING OF USE CASES
# =============================================================================
#  Every time the site is built, each use case is scanned for the keywords below.
#  A topic becomes a TAG of the card, a tool or method becomes a TECHNOLOGY, when its
#  keywords show up often enough. You never have to tag a use case by hand - but anything
#  you do write under `tags:` or `stack:` in a card is kept and shown first.
#
#  HOW TO EDIT THIS FILE
#   - The name before the colon is what visitors see on the card and in the filters.
#   - Below it, list the words or phrases that point to that topic. Upper/lower case is
#     ignored ("Soil" = "soil"), and a hyphen matches a space ("land-cover" = "land cover").
#   - A star matches any word ending: "hydrolog*" finds hydrology, hydrological, hydrologist.
#   - Short ALL-CAPS abbreviations (RAG, EIA, GIS) only match in capitals, so "rag" or "sea"
#     in everyday text is not mistaken for them.
#   - Optional `min:` raises (or lowers) how strongly a topic must appear before it is used.
#     Use it for broad words that appear in almost every submission.
#   - To stop automatic tagging for one card, add `auto_tag: false` to that card.
#
#  HOW THE SCORE WORKS
#   Each keyword counts once per mention in the text (at most 3), and 3 extra points when it is
#   in the title, short line or summary. A topic is used when its score reaches `min_score`.
# =============================================================================

settings:
  min_score: 3                # default threshold for topics
  min_score_technologies: 2   # default threshold for technologies
  max_tags: 6                 # at most this many automatic tags per card
  max_technologies: 5         # ... and this many technologies

