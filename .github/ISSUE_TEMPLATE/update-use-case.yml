# Generated by scripts/card_forms.py - do not edit by hand (run: python scripts/card_forms.py --write).
name: Update a use case
description: Change the content of an existing use case. Opened from the card's Update button, already filled in.
title: 'Update use case: '
body:
- type: markdown
  attributes:
    value: '### Update a use case


      Leave a box as it is to keep the card as it is. Change the text to update it. To remove a value from the card
      altogether, type a single dash (-). Empty boxes are ignored. (A box that is empty although the card has text
      there did not fit into the pre-filled address: the card''s current text stays as it is.)


      When you submit, a workflow prepares the change on a new branch and posts a link here to open the pull request.
      Only repository collaborators can run it.'
- type: input
  id: card
  attributes:
    label: Card (file name)
    description: The card's file name without .yaml. It is filled in for you - please do not change it.
  validations:
    required: true
- type: input
  id: name
  attributes:
    label: Name
- type: input
  id: quip
  attributes:
    label: Teaser
    description: One short line shown on the card.
- type: textarea
  id: summary
  attributes:
    label: Summary
    description: Two sentences for the card and the top of the page.
- type: dropdown
  id: main_area
  attributes:
    label: Main area
    options:
    - (keep)
    - Strategy, Governance and Organisation
    - People, Skills and Ways of Working
    - Data, Technologies and Infrastructure
    - AI Applications and Value Creation
    default: 0
- type: input
  id: country
  attributes:
    label: Country
    description: 'Several: separate with commas.'
- type: input
  id: affiliation
  attributes:
    label: Organisation
- type: input
  id: contact
  attributes:
    label: Contact
    description: Name <email>
- type: input
  id: tags
  attributes:
    label: Tags
    description: Your own tags, separated by commas. The automatic tags are added on top.
- type: input
  id: stack
  attributes:
    label: Technologies
    description: Your own, separated by commas. The automatic ones are added on top.
- type: textarea
  id: challenge
  attributes:
    label: Challenge or opportunity
- type: textarea
  id: proposed_ai
  attributes:
    label: Proposed use of AI
- type: textarea
  id: scope
  attributes:
    label: Scope
    description: Lines starting with '- ' become bullet points.
- type: textarea
  id: expected_outcome
  attributes:
    label: Expected outcome
- type: textarea
  id: environmental_contribution
  attributes:
    label: Contribution to the environment
- type: textarea
  id: digital_contribution
  attributes:
    label: Contribution to the digital agenda
- type: textarea
  id: conditions
  attributes:
    label: Key conditions and considerations
    description: Lines starting with '- ' become bullet points.
