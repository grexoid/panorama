name: Validate cards

# Runs on every PR so mistakes in a card show up as annotations on the changed
# file instead of a failed deployment after merging.
on:
  pull_request:
    paths:
      - "cards/**"
      - "resources/templates/**"
      - "resources/examples/**"
      - "site/**"
      - "scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site (strict)
        run: python scripts/build.py --strict

      # Keep the blank templates and the example cards valid, so what people copy always works.
      - name: Check templates and examples
        run: |
          mkdir -p "$RUNNER_TEMP/templates/projects" "$RUNNER_TEMP/templates/use-cases"
          cp resources/templates/project-card.yaml "$RUNNER_TEMP/templates/projects/"
          cp resources/templates/use-case-card.yaml "$RUNNER_TEMP/templates/use-cases/"
          python scripts/build.py --strict --cards "$RUNNER_TEMP/templates" --out "$RUNNER_TEMP/templates-out"
          python scripts/build.py --strict --cards resources/examples --out "$RUNNER_TEMP/examples-out"

      # A protected build must not leak any readable card text or image (dummy password, only for this check).
      - name: Check password protection
        env:
          GALLERY_PASSWORD: ci-check-password
        run: |
          python scripts/build.py --strict --require-password --out "$RUNNER_TEMP/protected"
          python scripts/check_protected.py "$RUNNER_TEMP/protected"
          # A second deployment must use the same key: a browser may still hold files of the first one in its cache.
          python scripts/build.py --strict --require-password --out "$RUNNER_TEMP/protected-2"
          python scripts/check_protected.py "$RUNNER_TEMP/protected-2" --same-key-as "$RUNNER_TEMP/protected"

      # The tools that change cards must keep working (each test works on sample cards or a copy of the real ones).
      - name: Check the Word importer
        run: python scripts/check_importer.py

      - name: Check the card update, promote and request tools
        run: |
          python scripts/card_forms.py --check
          python scripts/check_update.py
          python scripts/check_promote.py
          python scripts/check_requests.py
