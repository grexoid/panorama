name: Promote use case to project

# For when an idea has become real work. Actions tab -> "Promote use case to project" -> Run workflow -> fill in the form.
# The card moves from cards/use-cases to cards/projects, the result is checked with the normal site build, and it is
# pushed to a new branch. The run summary then links to GitHub's pull-request form, so the usual "Validate cards"
# check runs on the pull request and a person looks at it before it is merged.
on:
  workflow_dispatch:
    inputs:
      card:
        description: "Name of the use case: its file name without .yaml (= the last part of its web address)"
        required: true
        type: string
      website:
        description: "The project's website (https://...). Give this and/or the repository."
        required: false
        type: string
      repo_url:
        description: "The project's code repository (https://...)"
        required: false
        type: string
      demo_url:
        description: "Optional: a place to try it out"
        required: false
        type: string
      docs_url:
        description: "Optional: documentation"
        required: false
        type: string
      status:
        description: "Project status"
        required: true
        type: choice
        default: beta
        options: [beta, active, maintenance, archived]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    # Form values are passed as environment variables, never pasted into the shell commands.
    env:
      CARD: ${{ inputs.card }}
      WEBSITE: ${{ inputs.website }}
      REPO_URL: ${{ inputs.repo_url }}
      DEMO_URL: ${{ inputs.demo_url }}
      DOCS_URL: ${{ inputs.docs_url }}
      STATUS: ${{ inputs.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Promote the card
        run: >
          python scripts/promote_card.py "$CARD"
          --website "$WEBSITE" --repo-url "$REPO_URL" --demo-url "$DEMO_URL" --docs-url "$DOCS_URL"
          --status "$STATUS"

      - name: Check that the site still builds
        run: python scripts/build.py --strict

      - name: Push a branch with the change
        id: push
        run: |
          branch="promote/${CARD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A cards
          git commit -m "Promote use case ${CARD} to a project"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Link to the pull request form
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo "### The change is ready on branch \`$BRANCH\`"
            echo
            echo "**[Open the pull request](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE}...${BRANCH}?expand=1)** - the *Validate cards* check runs on it, then merge it to update the site."
            echo
            echo "Before merging, open \`cards/projects/${CARD}.yaml\` in the pull request and check the description, the links and the status."
          } >> "$GITHUB_STEP_SUMMARY"
